<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color: black;color: whitesmoke;">
    <ul class = "list">
        <li>Javascript</li>
    </ul>
</body>
<script>
    function addLanguage(newLang){
        const li = document.createElement('li');
        li.textContent=`${newLang}`;
        const attach = document.querySelector("li");
        attach.appendChild(li)
    }

    addLanguage("python")
    addLang("Rust")
    addLang("C++")
    addLang("Java")
    addLang("C")

    
</script>
</html>
